services:
  webwaifu:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      TWITCH_BACKEND_RUNTIME_ENABLED: ${TWITCH_BACKEND_RUNTIME_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      INWORLD_API_KEY: ${INWORLD_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OVERLAY_SIGNING_SECRET: ${OVERLAY_SIGNING_SECRET:-}
    volumes:
      - webwaifu_data:/app/.webwaifu4
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - webwaifu
    environment:
      WEBWAIFU_SITE_ADDRESS: ${WEBWAIFU_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  webwaifu_data:
  caddy_data:
  caddy_config:
